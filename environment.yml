# Create or update the conda env `main` with the packages this repo needs.
#   conda env update -n main -f environment.yml
name: main
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pandas>=2.0
  - pyarrow
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj
  - rasterio>=1.3
  - scipy
  - matplotlib
  - pyyaml
  - requests
  - pytest
